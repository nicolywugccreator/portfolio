<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Nicoly W. | UGC Content Creator</title>
<meta name="description" id="page-description" content="Nicoly W., UGC content creator. Authentic videos and photos that help brands sell more.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@500;700&family=Permanent+Marker&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --preto:#111111;
    --azul:#2b6fff;
    --laranja:#ff6a2b;
    --limao:#c3f53a;
    --magenta:#ff3da6;
    --papel:#f7f2e6;
    --branco:#ffffff;
    --sombra-dura:5px 5px 0 var(--preto);
    --sombra-dura-lg:8px 8px 0 var(--preto);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background-color:var(--papel);
    background-image:
      linear-gradient(rgba(17,17,17,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(17,17,17,0.06) 1px, transparent 1px);
    background-size:38px 38px;
    color:var(--preto);
    font-family:'Poppins', sans-serif;
    line-height:1.55;
    overflow-x:hidden;
  }
  h1,h2,h3{
    font-family:'Archivo Black', sans-serif;
    line-height:1.1;
    margin:0 0 .5em 0;
    text-transform:uppercase;
  }
  p{margin:0 0 1em 0;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}
  ul{list-style:none;margin:0;padding:0;}
  section{padding:5rem 6vw;max-width:1280px;margin:0 auto;}

  .skip-link{
    position:absolute;left:-999px;top:0;background:var(--limao);color:var(--preto);
    padding:.8rem 1.2rem;z-index:999;font-weight:600;
  }
  .skip-link:focus{left:1rem;top:1rem;}

  :focus-visible{outline:3px solid var(--azul);outline-offset:3px;}

  .tag-manuscrita{
    font-family:'Poppins', sans-serif;
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    font-size:.8rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--preto);
    background:var(--laranja);
    border:2.5px solid var(--preto);
    border-radius:999px;
    padding:.5rem 1.1rem;
    box-shadow:3px 3px 0 var(--preto);
    margin-bottom:1.2rem;
    transform:rotate(-2deg);
  }
  .tag-manuscrita::before{content:"●";font-size:.55rem;}

  .btn{
    display:inline-block;
    font-family:'Poppins', sans-serif;
    font-weight:700;
    padding:.9rem 1.8rem;
    border:3px solid var(--preto);
    border-radius:6px;
    box-shadow:var(--sombra-dura);
    transition:transform .15s ease, box-shadow .15s ease;
    cursor:pointer;
  }
  .btn:hover, .btn:focus-visible{
    transform:translate(-3px,-3px);
    box-shadow:8px 8px 0 var(--preto);
  }
  .btn:active{
    transform:translate(0,0);
    box-shadow:2px 2px 0 var(--preto);
  }
  .btn-primario{background:var(--laranja);color:var(--preto);}
  .btn-secundario{background:var(--branco);color:var(--preto);}
  .btn-contato{background:var(--azul);color:var(--branco);margin:.4rem;}
  .hero-botoes{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.6rem;}

  /* ===================== HEADER ===================== */
  .site-header{
    position:fixed;top:0;left:0;right:0;z-index:500;
    background-color:var(--papel);
    background-image:
      linear-gradient(rgba(17,17,17,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(17,17,17,0.06) 1px, transparent 1px);
    background-size:38px 38px;
  }
  .header-inner{
    max-width:1280px;margin:0 auto;padding:.9rem 6vw;
    display:flex;align-items:center;justify-content:space-between;
    gap:1rem;
  }
  .logo{
    font-family:'Archivo Black', sans-serif;
    font-size:1.4rem;
    letter-spacing:.5px;
  }
  .logo::before{content:"✱ ";color:var(--limao);}
  .logo span{color:var(--magenta);}
  .nav-principal{margin-left:auto;}
  .nav-principal ul{display:flex;gap:1.8rem;align-items:center;}
  .nav-principal a{
    font-weight:600;
    font-size:.95rem;
    text-transform:uppercase;
    letter-spacing:.5px;
    padding:.3rem .1rem;
    border-bottom:3px solid transparent;
    transition:border-color .15s ease, color .15s ease;
  }
  .nav-principal a:hover, .nav-principal a:focus-visible{
    border-color:var(--laranja);
  }
  .nav-cta{
    background:var(--limao);
    border:2px solid var(--preto) !important;
    border-radius:5px;
    padding:.5rem 1rem !important;
    box-shadow:3px 3px 0 var(--preto);
  }
  .controles-header{display:flex;align-items:center;gap:.7rem;}
  .btn-idioma{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:.85rem;
    background:var(--magenta);
    color:var(--branco);
    border:2px solid var(--preto);
    border-radius:20px;
    padding:.45rem 1rem;
    box-shadow:3px 3px 0 var(--preto);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .btn-idioma:hover, .btn-idioma:focus-visible{transform:translate(-2px,-2px);}
  .btn-hamburguer{
    display:none;
    flex-direction:column;
    justify-content:center;
    gap:5px;
    width:44px;height:44px;
    background:var(--branco);
    border:2px solid var(--preto);
    border-radius:6px;
    box-shadow:3px 3px 0 var(--preto);
    cursor:pointer;
    flex-shrink:0;
  }
  .btn-hamburguer span{
    display:block;width:22px;height:3px;background:var(--preto);
    margin:0 auto;transition:transform .25s ease, opacity .25s ease;
  }
  .btn-hamburguer.aberto span:nth-child(1){transform:translateY(8px) rotate(45deg);}
  .btn-hamburguer.aberto span:nth-child(2){opacity:0;}
  .btn-hamburguer.aberto span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

  @media (max-width:900px){
    .nav-principal{
      position:fixed;top:64px;left:0;right:0;
      background:var(--papel);
      border-bottom:3px solid var(--preto);
      max-height:0;
      overflow:hidden;
      transition:max-height .3s ease;
    }
    .nav-principal.aberto{max-height:420px;}
    .nav-principal ul{flex-direction:column;align-items:flex-start;gap:0;padding:1rem 6vw 1.5rem;}
    .nav-principal li{width:100%;padding:.6rem 0;border-bottom:1px solid rgba(17,17,17,.1);}
    .btn-hamburguer{display:flex;}
  }

  /* ===================== HERO ===================== */
  .hero{padding-top:9rem;position:relative;overflow:visible;}
  .hero-inner{
    display:flex;align-items:center;gap:3rem;flex-wrap:wrap;
  }
  .hero-texto{flex:1 1 380px;}
  .hero-texto h1{
    font-size:clamp(2.6rem, 7vw, 4.6rem);
    display:inline-block;
    color:var(--preto);
    -webkit-text-stroke:2px var(--preto);
    text-stroke:2px var(--preto);
    text-shadow:5px 5px 0 var(--magenta);
  }
  .hero-subtitulo{font-size:1.2rem;max-width:36ch;}

  .hero-foto{
    flex:1 1 320px;
    max-width:390px;
    margin:0 auto;
    background:var(--branco);
    border:4px solid var(--preto);
    border-radius:10px;
    padding:14px 14px 46px;
    box-shadow:var(--sombra-dura-lg);
    position:relative;
    transform:rotate(-4deg);
    transition:transform .2s ease;
  }
  .hero-foto:hover{transform:rotate(-1deg) translateY(-4px);}
  .hero-foto-moldura{
    aspect-ratio:4/5;
    border-radius:4px;
    overflow:hidden;
    border:2px solid var(--preto);
  }
  .hero-foto img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-foto-legenda{
    position:absolute;left:0;right:0;bottom:10px;text-align:center;
    font-family:'Permanent Marker', cursive;
    font-size:1rem;
    color:var(--preto);
    margin:0;
  }
  /* TO SWAP THE PHOTO: replace foto-hero.jpg (in the same folder as this file) with your own image */


  /* ===================== BRAND STRIP ===================== */
  .marcas-faixa{
    background:transparent;
    padding:.5rem 0 1.5rem;
    overflow:hidden;
  }
  .marcas-track{
    display:flex;gap:1rem;align-items:center;white-space:nowrap;
    animation:rolar 22s linear infinite;
    width:max-content;
  }
  .marcas-track span{
    display:inline-block;
    background:var(--branco);
    color:var(--preto);
    font-family:'Archivo Black', sans-serif;
    font-size:.9rem;
    text-transform:uppercase;
    border:2.5px solid var(--preto);
    border-radius:999px;
    padding:.4rem 1.1rem;
    box-shadow:2px 2px 0 var(--preto);
  }
  .marcas-track span:nth-child(4n+1){background:var(--limao);}
  .marcas-track span:nth-child(4n+2){background:var(--azul);color:var(--branco);}
  .marcas-track span:nth-child(4n+4){background:var(--laranja);}
  @keyframes rolar{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }

  /* ===================== ABOUT ===================== */
  .sobre{display:flex;align-items:center;gap:3rem;flex-wrap:wrap;}
  .sobre-foto{
    flex:1 1 300px;max-width:380px;aspect-ratio:1/1;
    border-radius:50% 50% 50% 8%;
    border:4px solid var(--preto);
    background:linear-gradient(135deg, var(--limao), var(--azul));
    box-shadow:var(--sombra-dura-lg);
    overflow:hidden;
  }
  .sobre-foto img{width:100%;height:100%;object-fit:cover;display:block;}
  /* TO SWAP THE PHOTO: replace foto-sobre.jpg (in the same folder as this file) with your own image */
  .sobre-texto{flex:1 1 380px;}
  .sobre-texto p{font-size:1.08rem;}

  /* ===================== PORTFOLIO ===================== */
  .portfolio h2, .servicos h2, .resultados h2, .depoimentos h2, .contato h2{text-align:center;}
  .filtros{
    display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin:1.5rem 0 2.5rem;
  }
  .filtro-btn{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    background:var(--branco);
    border:2px solid var(--preto);
    border-radius:30px;
    padding:.5rem 1.2rem;
    box-shadow:3px 3px 0 var(--preto);
    cursor:pointer;
    transition:transform .15s ease, background .15s ease;
  }
  .filtro-btn:hover, .filtro-btn:focus-visible{transform:translate(-2px,-2px);}
  .filtro-btn.ativo{background:var(--magenta);color:var(--branco);}

  .galeria{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:1.6rem;
  }
  .item-portfolio{
    font:inherit;
    text-align:left;
    background:var(--branco);
    border:4px solid var(--preto);
    border-radius:16px;
    box-shadow:var(--sombra-dura);
    display:flex;
    flex-direction:column;
    padding:0;
    cursor:pointer;
    transition:transform .2s ease;
    overflow:hidden;
  }
  .item-portfolio:hover{transform:translateY(-4px);}
  .item-portfolio.escondido{display:none;}

  .portfolio-midia{
    position:relative;
    aspect-ratio:9/16;
    overflow:hidden;
    display:block;
  }
  .portfolio-midia img{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;
    /* Keeps custom cover photos and auto YouTube thumbnails looking like
       one consistent set instead of a mismatched grid. */
    filter:saturate(.92) contrast(1.05) sepia(.06);
  }
  .play-icon{
    position:absolute;top:50%;left:50%;transform:translate(-46%,-50%);
    width:48px;height:48px;border-radius:50%;
    background:rgba(17,17,17,.55);
    border:2px solid rgba(255,255,255,.85);
    display:flex;align-items:center;justify-content:center;
    color:var(--branco);font-size:1rem;z-index:2;
  }

  .portfolio-tag{
    position:absolute;top:.6rem;left:.6rem;z-index:2;
    font-family:'Poppins', sans-serif;
    font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
    background:var(--limao);color:var(--preto);
    border:2px solid var(--preto);border-radius:999px;
    padding:.25rem .65rem;
    box-shadow:2px 2px 0 var(--preto);
  }

  .portfolio-info{padding:.9rem 1rem 1.1rem;}
  .portfolio-titulo{
    display:block;
    font-family:'Archivo Black', sans-serif;
    text-transform:none;
    font-size:1rem;
    line-height:1.25;
  }

  /* ===================== PORTFOLIO VIDEO MODAL ===================== */
  .portfolio-modal{
    position:fixed;inset:0;z-index:1000;
    background:rgba(17,17,17,.82);
    display:flex;align-items:center;justify-content:center;
    padding:2.5rem 1.5rem;
  }
  .portfolio-modal[hidden]{display:none;}
  .portfolio-modal-conteudo{
    position:relative;
    width:100%;
    max-width:400px;
    background:var(--preto);
    border:4px solid var(--preto);
    border-radius:18px;
    box-shadow:var(--sombra-dura-lg);
  }
  .portfolio-modal-midia{
    position:relative;
    aspect-ratio:9/16;
    max-height:82vh;
    border-radius:14px;
    overflow:hidden;
  }
  .portfolio-modal-midia iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .portfolio-modal-fechar{
    position:absolute;top:-18px;right:-18px;z-index:2;
    width:42px;height:42px;border-radius:50%;
    background:var(--laranja);
    border:3px solid var(--preto);
    box-shadow:3px 3px 0 var(--preto);
    font-size:1.5rem;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--preto);font-weight:700;
    transition:transform .15s ease;
  }
  .portfolio-modal-fechar:hover, .portfolio-modal-fechar:focus-visible{transform:translate(-2px,-2px);}

  /* ===================== PROPOSAL POPUP ===================== */
  .proposta-modal{
    position:fixed;inset:0;z-index:1000;
    background:rgba(17,17,17,.82);
    display:flex;align-items:center;justify-content:center;
    padding:1.5rem;
  }
  .proposta-modal[hidden]{display:none;}
  .proposta-modal-wrapper{
    position:relative;
    width:100%;max-width:380px;
  }
  .proposta-modal-conteudo{
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    background:var(--branco);
    border:4px solid var(--preto);
    border-radius:16px;
    box-shadow:var(--sombra-dura-lg);
  }
  .proposta-modal-fechar{
    position:absolute;top:-18px;right:-18px;z-index:3;
    width:42px;height:42px;border-radius:50%;
    background:var(--laranja);border:3px solid var(--preto);
    box-shadow:3px 3px 0 var(--preto);
    display:flex;align-items:center;justify-content:center;
    font-size:1.5rem;line-height:1;color:var(--preto);font-weight:700;
    cursor:pointer;transition:transform .15s ease;
  }
  .proposta-modal-fechar:hover, .proposta-modal-fechar:focus-visible{transform:translate(-2px,-2px);}
  .proposta-modal-corpo{padding:1.3rem 1.3rem 1.5rem;}
  .proposta-tag{
    display:inline-block;
    font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
    color:var(--laranja);margin-bottom:.3rem;
  }
  .proposta-modal-corpo h3{
    font-size:1.15rem;text-transform:none;margin-bottom:.25rem;
  }
  .proposta-destaque{color:var(--azul);font-style:italic;}
  .proposta-subtitulo{font-size:.8rem;color:rgba(17,17,17,.65);margin-bottom:.9rem;}
  .proposta-modal-corpo .form-contato label{font-size:.72rem;}
  .proposta-modal-corpo .form-contato input,
  .proposta-modal-corpo .form-contato select{
    padding:.55rem .7rem;
    margin-bottom:.45rem;
    font-size:.88rem;
  }
  .proposta-modal-corpo .form-contato textarea{
    padding:.55rem .7rem;
    margin-bottom:.45rem;
    font-size:.88rem;
    min-height:60px;
  }
  .proposta-modal-corpo .btn{padding:.65rem 1.3rem;font-size:.92rem;}
  .form-contato select{
    font-family:'Poppins', sans-serif;
    padding:.8rem;
    border:2px solid var(--preto);
    border-radius:8px;
    font-size:1rem;
    margin-bottom:.8rem;
    background:var(--branco);
    color:var(--preto);
  }

  /* ===================== SERVICES ===================== */
  .grid-servicos{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
    gap:1.8rem;
  }
  .card-servico{
    background:var(--branco);
    border:3px solid var(--preto);
    border-radius:12px;
    padding:1.8rem;
    box-shadow:var(--sombra-dura);
  }
  .card-servico .emoji{font-size:2.2rem;}
  .card-servico h3{font-size:1.1rem;text-transform:none;font-family:'Archivo Black', sans-serif;}

  /* ===================== RESULTS ===================== */
  .grid-resultados{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:1.6rem;
    text-align:center;
  }
  .card-resultado{
    background:var(--preto);
    color:var(--papel);
    border-radius:12px;
    padding:2rem 1rem;
    box-shadow:6px 6px 0 var(--laranja);
  }
  .card-resultado .numero{
    font-family:'Archivo Black', sans-serif;
    font-size:2.6rem;
    color:var(--limao);
  }
  .card-resultado .label{font-size:.95rem;opacity:.9;}

  /* ===================== TESTIMONIALS ===================== */
  .grid-depoimentos{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:1.8rem;
  }
  .card-depoimento{
    background:var(--branco);
    border:3px solid var(--preto);
    border-radius:6px;
    padding:1.9rem 1.6rem 1.5rem;
    box-shadow:6px 6px 0 var(--preto);
    position:relative;
  }
  .card-depoimento:nth-child(4n+1){transform:rotate(-2.5deg);}
  .card-depoimento:nth-child(4n+2){transform:rotate(2deg);}
  .card-depoimento:nth-child(4n+3){transform:rotate(-1.5deg);}
  .card-depoimento:nth-child(4n+4){transform:rotate(2.5deg);}

  .card-depoimento .fita{
    position:absolute;top:-15px;left:50%;
    width:78px;height:28px;
    opacity:.9;
    background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.4) 0 6px, transparent 6px 13px);
    box-shadow:0 2px 3px rgba(0,0,0,.18);
    clip-path:polygon(2% 20%, 7% 0%, 93% 0%, 98% 20%, 100% 80%, 93% 100%, 7% 100%, 0% 80%);
  }
  .card-depoimento:nth-child(4n+1) .fita{background:var(--limao);transform:translateX(-50%) rotate(-5deg);}
  .card-depoimento:nth-child(4n+2) .fita{background:var(--laranja);transform:translateX(-50%) rotate(4deg);}
  .card-depoimento:nth-child(4n+3) .fita{background:var(--azul);transform:translateX(-50%) rotate(-3deg);}
  .card-depoimento:nth-child(4n+4) .fita{background:var(--magenta);transform:translateX(-50%) rotate(5deg);}

  .card-depoimento p.fala{font-size:.98rem;font-weight:600;line-height:1.55;color:var(--preto);margin:.4rem 0 1.1rem;}
  .card-depoimento p.fala::before{content:"\201C";}
  .card-depoimento p.fala::after{content:"\201D";}
  .card-depoimento .empresa{
    font-family:'Archivo Black', sans-serif;
    font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;
    display:inline-block;border:2px solid var(--preto);border-radius:999px;padding:.3rem .8rem;
  }
  .card-depoimento:nth-child(4n+1) .empresa{background:var(--limao);color:var(--preto);}
  .card-depoimento:nth-child(4n+2) .empresa{background:var(--laranja);color:var(--preto);}
  .card-depoimento:nth-child(4n+3) .empresa{background:var(--azul);color:var(--branco);}
  .card-depoimento:nth-child(4n+4) .empresa{background:var(--magenta);color:var(--branco);}

  /* ===================== CONTACT ===================== */
  .contato-grid{
    display:flex;gap:3rem;flex-wrap:wrap;
    background:var(--branco);
    border:4px solid var(--preto);
    border-radius:16px;
    box-shadow:var(--sombra-dura-lg);
    padding:2.5rem;
  }
  .form-contato{flex:1 1 320px;display:flex;flex-direction:column;gap:.4rem;}
  .form-contato label{font-weight:700;font-size:.9rem;text-transform:uppercase;}
  .form-contato input, .form-contato textarea{
    font-family:'Poppins', sans-serif;
    padding:.8rem;
    border:2px solid var(--preto);
    border-radius:8px;
    font-size:1rem;
    margin-bottom:.8rem;
    resize:vertical;
  }
  .form-contato input:focus, .form-contato textarea:focus{outline:3px solid var(--azul);}
  .msg-confirmacao{font-weight:700;color:var(--azul);min-height:1.2em;}
  .contato-direto{
    flex:1 1 260px;
    display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  }
  .contato-direto .btn-contato{width:100%;text-align:center;}

  /* ===================== FOOTER ===================== */
  .rodape{

// Brand names are managed from my.panel now (table "portfolio_marcas"),
// not hardcoded in DADOS.marcas anymore.
let marcasCache = [];

async function carregarMarcas(){
  if(!clienteAnalytics) return [];
  const { data, error } = await clienteAnalytics
    .from("portfolio_marcas")
    .select("*")
    .order("ordem", { ascending: true });
  if(error){
    console.warn("Falha ao carregar marcas:", error.message);
    return [];
  }
  return data;
}

function renderizarMarcas(){
  const track = document.getElementById("marcas-track");
  if(marcasCache.length === 0){
    track.innerHTML = "";
    return;
  }
  const nomes = marcasCache.map(m => m.nome);
  const listaDupla = [...nomes, ...nomes];
  track.innerHTML = listaDupla.map(nome => `<span>${nome}</span>`).join("");
}

function renderizarDepoimentos(t){
  const secao = document.getElementById("depoimentos");
  if(depoimentosCache.length === 0){
    secao.hidden = true;
    return;
  }
  secao.hidden = false;
  document.getElementById("titulo-depoimentos").textContent = t.tituloDepoimentos;
  secao.setAttribute("aria-label", t.ariaLabels.depoimentos);

  document.getElementById("grid-depoimentos").innerHTML = depoimentosCache.map(d => `
    <div class="card-depoimento reveal">
      <span class="fita" aria-hidden="true"></span>
      <p class="fala">${escapeHtmlPublico(d.texto)}</p>
      ${d.empresa ? `<span class="empresa">${escapeHtmlPublico(d.empresa)}</span>` : ""}
    </div>
  `).join("");

function escapeHtmlPublico(texto){
  const div = document.createElement("div");
  div.textContent = String(texto);
  return div.innerHTML;
}

function renderizarPortfolio(t){
  document.getElementById("titulo-portfolio").textContent = t.tituloPortfolio;
  document.getElementById("portfolio").setAttribute("aria-label", t.ariaLabels.portfolio);
  document.getElementById("portfolio-modal-fechar").setAttribute("aria-label", t.ariaLabels.fecharVideo);

  const chavesCategoria = ["todos", ...new Set(itensPortfolioCache.map(i => i.categoria))];
  const filtrosEl = document.getElementById("filtros");
  filtrosEl.innerHTML = chavesCategoria.map((chave, i) =>
    `<button class="filtro-btn${i === 0 ? " ativo" : ""}" data-categoria="${chave}">${t.categorias[chave] || chave}</button>`
  ).join("");

  const galeriaEl = document.getElementById("galeria");
  galeriaEl.innerHTML = itensPortfolioCache.map((item) => `
    <button type="button" class="item-portfolio" data-categoria="${item.categoria}" data-video-id="${item.video_id}" data-titulo="${item.titulo}" aria-label="${t.ariaLabels.assistirVideo}: ${item.titulo}">
      <span class="portfolio-midia">
        ${item.tag ? `<span class="portfolio-tag">${item.tag}</span>` : ""}
        <img src="${item.capa_url || ('https://img.youtube.com/vi/' + item.video_id + '/hqdefault.jpg')}" alt="" loading="lazy">
        <span class="play-icon" aria-hidden="true">▶</span>
      </span>
      <span class="portfolio-info">
        <span class="portfolio-titulo">${item.titulo}</span>
      </span>
    </button>
  `).join("");
  // EDIT HERE: portfolio videos are managed from my.panel now — see the "Portfolio" tab there.

  galeriaEl.querySelectorAll(".item-portfolio").forEach(botao => {
    botao.addEventListener("click", () => {
      abrirModalPortfolio(botao.dataset.videoId, botao.dataset.titulo, botao);
    });
  });

  filtrosEl.querySelectorAll(".filtro-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      filtrosEl.querySelectorAll(".filtro-btn").forEach(b => b.classList.remove("ativo"));
      btn.classList.add("ativo");
      const chave = btn.dataset.categoria;
      galeriaEl.querySelectorAll(".item-portfolio").forEach(item => {
        const mostrar = chave === "todos" || item.dataset.categoria === chave;
        item.classList.toggle("escondido", !mostrar);
      });
    });
  });
}

let ultimoBotaoDePortfolio = null;

// ===================== YOUTUBE IFRAME API (para medir quanto foi assistido) =====================
let ytApiPronta = false;
let ytApiFalhou = false;
const filaCallbacksYT = [];

window.onYouTubeIframeAPIReady = function(){
  ytApiPronta = true;
  filaCallbacksYT.forEach(fn => fn());
  filaCallbacksYT.length = 0;
};

function comYouTubeAPI(aoPronto, aoFalhar){
  if(ytApiPronta){ aoPronto(); return; }
  if(ytApiFalhou){ aoFalhar(); return; }

  filaCallbacksYT.push(aoPronto);
  if(!document.getElementById("youtube-iframe-api-script")){
    const script = document.createElement("script");
    script.id = "youtube-iframe-api-script";
    script.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(script);
  }
  setTimeout(() => {
    if(!ytApiPronta){
      ytApiFalhou = true;
      aoFalhar();
    }
  }, 4000);
}

let ytPlayerAtual = null;
let ytVideoIdAtual = null;
let ytTituloAtual = null;

// Registra ate onde a pessoa chegou no video (usado ao fechar o modal ou quando o video termina)
function registrarProgressoVideo(){
  if(!ytPlayerAtual || typeof ytPlayerAtual.getDuration !== "function") return;
  try {
    const duracao = Math.round(ytPlayerAtual.getDuration());
    if(!duracao) return;
    const segundos = Math.round(ytPlayerAtual.getCurrentTime());
    const percentual = Math.min(100, Math.round((segundos / duracao) * 100));
    registrarEvento("video_progress", ytVideoIdAtual, { title: ytTituloAtual, seconds: segundos, duration: duracao, percent: percentual });
  } catch (erro) {
    console.warn("Could not read video progress:", erro);
  }
}

function abrirModalPortfolio(videoId, titulo, botaoOrigem){
  const modal = document.getElementById("portfolio-modal");
  const midia = document.getElementById("portfolio-modal-midia");
  midia.innerHTML = `<div id="youtube-player-portfolio"></div>`;
  modal.setAttribute("aria-label", titulo);
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  ultimoBotaoDePortfolio = botaoOrigem;
  document.getElementById("portfolio-modal-fechar").focus();
  registrarEvento("video_view", videoId, { title: titulo });

  ytPlayerAtual = null;
  ytVideoIdAtual = videoId;
  ytTituloAtual = titulo;

  comYouTubeAPI(
    () => {
      if(!document.getElementById("youtube-player-portfolio")) return;
      ytPlayerAtual = new YT.Player("youtube-player-portfolio", {
        videoId: videoId,
        playerVars: { autoplay: 1, rel: 0 },
        events: {
          onStateChange: (evento) => {
            if(evento.data === YT.PlayerState.ENDED) registrarProgressoVideo();
          }
        }
      });
    },
    () => {
      const alvo = document.getElementById("youtube-player-portfolio");
      if(alvo){
        alvo.outerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" title="${titulo}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      }
    }
  );
}

function fecharModalPortfolio(){
  const modal = document.getElementById("portfolio-modal");
  if(modal.hidden) return;
  registrarProgressoVideo();
  if(ytPlayerAtual && typeof ytPlayerAtual.destroy === "function"){
    ytPlayerAtual.destroy();
  }
  ytPlayerAtual = null;
  document.getElementById("portfolio-modal-midia").innerHTML = "";
  modal.hidden = true;
  document.body.style.overflow = "";
  if(ultimoBotaoDePortfolio) ultimoBotaoDePortfolio.focus();
}

function configurarModalPortfolio(){
  const modal = document.getElementById("portfolio-modal");
  document.getElementById("portfolio-modal-fechar").addEventListener("click", fecharModalPortfolio);
  modal.addEventListener("click", (evento) => {
    if(evento.target === modal) fecharModalPortfolio();
  });
  document.addEventListener("keydown", (evento) => {
    if(evento.key === "Escape") fecharModalPortfolio();
  });
}

function configurarMenu(){

  btn.addEventListener("click", () => {
    const aberto = nav.classList.toggle("aberto");
    btn.classList.toggle("aberto", aberto);
    btn.setAttribute("aria-expanded", aberto ? "true" : "false");
    btn.setAttribute("aria-label", aberto ? TRADUCOES[idiomaAtual].ariaLabels.fecharMenu : TRADUCOES[idiomaAtual].ariaLabels.abrirMenu);
  });
  nav.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", () => {
      nav.classList.remove("aberto");
      btn.classList.remove("aberto");
      btn.setAttribute("aria-expanded", "false");
    });
  });
}

// ===================== SCROLL REVEAL ANIMATIONS =====================
function configurarRevelacao(){
  const observer = new IntersectionObserver((entradas) => {
    entradas.forEach(entrada => {
      if(entrada.isIntersecting){
        entrada.target.classList.add("visivel");
        observer.unobserve(entrada.target);
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll(".reveal:not(.visivel)").forEach(el => observer.observe(el));
}

// ===================== DIRECT EMAIL DELIVERY (Web3Forms) =====================
// Sends the message straight to Nicoly's inbox from the browser, no email
// app needed on the visitor's side. WEB3FORMS_ACCESS_KEY is a public key,
// safe to expose in client-side code (same model as the Supabase anon key).
const WEB3FORMS_ACCESS_KEY = "941df993-2b14-43d5-a6f0-cf681a4e8d20";

async function enviarEmailWeb3Forms(campos){
  const resposta = await fetch("https://api.web3forms.com/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify({ access_key: WEB3FORMS_ACCESS_KEY, ...campos })
  });
  const resultado = await resposta.json();
  if(!resultado.success) throw new Error(resultado.message || "Web3Forms request failed");
}

function configurarFormulario(){
  const form = document.getElementById("form-contato");
  const msg = document.getElementById("msg-confirmacao");
  const botao = document.getElementById("botao-enviar");

  form.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const t = TRADUCOES[idiomaAtual];
    const nome = document.getElementById("campo-nome").value.trim();
    const email = document.getElementById("campo-email").value.trim();
    const mensagem = document.getElementById("campo-mensagem").value.trim();

    if(!nome || !email || !mensagem){
      msg.textContent = t.erroFormulario;
      return;
    }

    const textoOriginal = botao.textContent;
    botao.disabled = true;

    registrarEvento("button_click", "contact_form_submit");
    registrarLead({ name: nome, email: email, message: mensagem, source: "contact" });

    try {
      await enviarEmailWeb3Forms({
        subject: `${t.assuntoEmail}: ${nome}`,
        from_name: nome,
        email: email,
        message: mensagem
      });
    } catch (erro) {
      console.error("Web3Forms failed, falling back to mailto:", erro);
      const assunto = encodeURIComponent(`${t.assuntoEmail}: ${nome}`);
      const corpo = encodeURIComponent(`${t.corpoEmailNome}: ${nome}\n${t.corpoEmailEmail}: ${email}\n\n${t.corpoEmailMensagem}:\n${mensagem}`);
      window.location.href = `mailto:${DADOS.email}?subject=${assunto}&body=${corpo}`;
    }

    msg.textContent = t.confirmacaoFormulario;
    form.reset();
    botao.disabled = false;
    botao.textContent = textoOriginal;
  });
}

  document.getElementById("proposta-modal-fechar").addEventListener("click", fecharModalProposta);

    if(evento.target.id === "proposta-modal") fecharModalProposta();
  });
  document.addEventListener("keydown", (evento) => {
    if(evento.key === "Escape") fecharModalProposta();
  });

  // Opens 1 minute after the page loads, but waits until the visitor
  // is done watching a portfolio video before interrupting them.
  const tentarMostrarProposta = () => {
    if(propostaJaMostrada) return;
    const modalVideoAberto = !document.getElementById("portfolio-modal").hidden;
    if(modalVideoAberto){
      setTimeout(tentarMostrarProposta, 5000);
      return;
    }
    propostaJaMostrada = true;
    abrirModalProposta();
  };
  setTimeout(tentarMostrarProposta, 60000);
}

function obterSessionId(){
  let id = sessionStorage.getItem("nicoly_session_id");
  if(!id){
    id = window.crypto && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    sessionStorage.setItem("nicoly_session_id", id);
  }
  return id;
}

function registrarEvento(eventType, eventName, metadata){
  if(!clienteAnalytics) return;
  clienteAnalytics.from("portfolio_events").insert({
    event_type: eventType,
    event_name: eventName || null,
    session_id: obterSessionId(),
    page_path: window.location.pathname,
    metadata: metadata || null
  }).then(({ error }) => { if(error) console.warn("Falha ao registrar evento:", error.message); });
}

    .then(({ error }) => { if(error) console.warn("Falha ao registrar mensagem:", error.message); });
}

// Reads a "where did this visitor come from" hint off the URL, so links you
// share can be tagged (e.g. nicolyugccreator.com/?from=instagram in your bio,
// ?from=email in emails you send). Falls back to the standard ?utm_source=
// param if that's what's used instead.
function obterOrigemVisita(){
  const parametros = new URLSearchParams(window.location.search);
  return parametros.get("from") || parametros.get("utm_source") || null;
}

// Country by IP, via a free no-key-required lookup. Best-effort: if it fails
// or is slow, the visit is still logged, just without a country.
async function obterPaisVisitante(){
  try {
    const resposta = await fetch("https://ipapi.co/json/");
    if(!resposta.ok) return null;
    const dados = await resposta.json();
    return dados.country_name || null;
  } catch (erro) {
    return null;
  }
}

async function configurarAnalytics(){
  const pais = await obterPaisVisitante();
  registrarEvento("page_view", null, {
    origem: obterOrigemVisita() || "direto",
    referrer: document.referrer || null,
    pais
  });

  document.getElementById("link-whatsapp").addEventListener("click", () => registrarEvento("button_click", "contact_whatsapp"));
  document.getElementById("link-email").addEventListener("click", () => registrarEvento("button_click", "contact_email"));
  document.getElementById("link-instagram").addEventListener("click", () => registrarEvento("button_click", "contact_instagram"));
  document.getElementById("hero-cta").addEventListener("click", () => registrarEvento("button_click", "hero_cta"));
  document.getElementById("hero-cta-secundario").addEventListener("click", () => registrarEvento("button_click", "hero_secondary"));
}

// ===================== INITIALIZATION =====================
document.addEventListener("DOMContentLoaded", async () => {
  renderizarTudo(idiomaAtual);
  configurarMenu();
  configurarIdioma();
  configurarFormulario();
  configurarModalPortfolio();
  configurarModalProposta();
  configurarFormularioProposta();
  configurarAnalytics();

  itensPortfolioCache = await carregarItensPortfolio();
  renderizarPortfolio(TRADUCOES[idiomaAtual]);

  marcasCache = await carregarMarcas();
  renderizarMarcas();

  depoimentosCache = await carregarDepoimentos();
  renderizarDepoimentos(TRADUCOES[idiomaAtual]);
});
</script>
