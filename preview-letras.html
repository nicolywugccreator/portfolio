<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Preview de letras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  body{
    margin:0;
    min-height:100vh;
    background:#fbf3e7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Archivo Black', sans-serif;
  }
  .bloco{
    padding:4rem;
    position:relative;
  }
  .ola{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:4.5rem;
    color:#ff4b3e;
    transform:rotate(-4deg);
    display:inline-block;
    margin:0;
    line-height:1;
  }
  .sou{
    font-size:2.2rem;
    color:#14141a;
    margin:.2rem 0 0 0;
    letter-spacing:2px;
  }
  .nome{
    font-size:clamp(3.5rem, 12vw, 8rem);
    color:#14141a;
    margin:0;
    line-height:.95;
    text-transform:uppercase;
    position:relative;
    display:inline-block;
  }
  .nome::after{
    content:"";
    position:absolute;
    right:-1.2rem;
    top:-1rem;
    width:2.2rem;
    height:2.2rem;
    background:#ffda1a;
    border:3px solid #14141a;
    border-radius:50%;
  }
  .asterisco{
    position:absolute;
    top:1rem;
    right:1rem;
    font-size:3rem;
    color:#3e8eff;
    transform:rotate(12deg);
  }
</style>
</head>
<body>
  <div class="bloco">
    <span class="asterisco" aria-hidden="true">✺</span>
    <p class="ola">Oi!</p>
    <p class="sou">EU SOU A</p>
    <p class="nome">Nicoly</p>
  </div>
</body>
</html>
